<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI助教答疑平台注册页面，创建个性化学习档案。">
  <title>注册 | AI助教答疑平台</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
</head>
<body class="auth-page register-page">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>

  <main class="auth-shell register-shell" id="main-content">
    <section class="brand-panel" aria-labelledby="brand-title">
      <div class="brand-topline">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <span>智能学习空间</span>
      </div>
      <p class="eyebrow">CREATE YOUR PROFILE</p>
      <h1 id="brand-title">从一次提问开始</h1>
      <p class="brand-copy">创建学习档案，让每次答疑更接近你的课程、目标与节奏。</p>
      <blockquote>“好的问题，会让学习真正发生。”</blockquote>
    </section>

    <section class="form-panel" aria-labelledby="register-title">
      <div class="panel-heading">
        <p class="eyebrow">GET STARTED</p>
        <h2 id="register-title">创建学习档案</h2>
        <p>填写基础信息，完成后即可登录体验。</p>
      </div>

      <p class="status-message" id="registerStatus" role="status" aria-live="polite"></p>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-grid two-columns">
          <div class="field">
            <label for="nickname">昵称</label>
            <input id="nickname" name="nickname" type="text" autocomplete="nickname" minlength="2" maxlength="16" placeholder="例如：小智" required>
            <p class="field-error" id="nicknameError" hidden></p>
          </div>

          <div class="field">
            <label for="registerEmail">邮箱地址</label>
            <input id="registerEmail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="name@example.com" required>
            <p class="field-error" id="registerEmailError" hidden></p>
          </div>
        </div>

        <div class="form-grid two-columns">
          <div class="field">
            <label for="phone">手机号码</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" pattern="1[3-9][0-9]{9}" placeholder="11 位手机号" required>
            <p class="field-error" id="phoneError" hidden></p>
          </div>

          <div class="field">
            <label for="role">学习身份</label>
            <select id="role" name="role" required>
              <option value="">请选择</option>
              <option value="学生">学生</option>
              <option value="教师">教师</option>
              <option value="自学者">自学者</option>
            </select>
            <p class="field-error" id="roleError" hidden></p>
          </div>
        </div>

        <div class="form-grid two-columns">
          <div class="field">
            <label for="school">学校或学习机构</label>
            <input id="school" name="school" type="text" list="schoolOptions" maxlength="40" placeholder="输入或选择" required>
            <datalist id="schoolOptions">
              <option value="示例大学"></option>
              <option value="在线学习中心"></option>
              <option value="自主学习"></option>
            </datalist>
          </div>

          <div class="field">
            <label for="grade">当前年级</label>
            <input id="grade" name="grade" type="number" min="1" max="12" step="1" inputmode="numeric" placeholder="1 - 12" required>
            <p class="field-error" id="gradeError" hidden></p>
          </div>
        </div>

        <div class="form-grid two-columns">
          <div class="field">
            <label for="birthday">出生日期</label>
            <input id="birthday" name="birthday" type="date" max="2014-12-31" required>
            <p class="field-error" id="birthdayError" hidden></p>
          </div>

          <div class="field">
            <label for="avatar">头像图片</label>
            <input id="avatar" name="avatar" type="file" accept="image/png,image/jpeg,image/webp">
            <p class="field-hint">可选，文件仅在当前页面预览。</p>
          </div>
        </div>

        <fieldset class="choice-group">
          <legend>主要学习兴趣</legend>
          <div class="choice-grid">
            <label><input type="checkbox" name="interests" value="编程">编程</label>
            <label><input type="checkbox" name="interests" value="数学">数学</label>
            <label><input type="checkbox" name="interests" value="物理">物理</label>
            <label><input type="checkbox" name="interests" value="语言">语言</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="registerPassword">设置密码</label>
          <div class="input-action">
            <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="32" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,32}" placeholder="至少 8 位，包含字母和数字" required>
            <button class="text-button password-toggle" type="button" aria-controls="registerPassword" aria-pressed="false">显示</button>
          </div>
          <div class="strength-row">
            <progress id="passwordStrength" max="4" value="0">0</progress>
            <output id="strengthText" for="registerPassword">尚未输入</output>
          </div>
          <p class="field-error" id="registerPasswordError" hidden></p>
        </div>

        <div class="field">
          <label for="confirmPassword">确认密码</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="32" placeholder="请再次输入密码" required>
          <p class="field-error" id="confirmPasswordError" hidden></p>
        </div>

        <label class="check-row terms-row">
          <input id="terms" name="terms" type="checkbox" required>
          <span>我已阅读并同意学习平台使用约定</span>
        </label>
        <p class="field-error terms-error" id="termsError" hidden></p>

        <button class="primary-button" type="submit">
          <span>完成注册</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <p class="switch-page">已有账号？<a href="index.html">返回登录</a></p>
    </section>
  </main>
</body>
</html>
